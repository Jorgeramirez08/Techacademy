<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/miEstilo0.css">
    <link rel="stylesheet" href="css/paginas.css">
    <title>Inscripción | TechAcademy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!--Encabezado-->
    <header>
        <div id="logo">
            <h1>TechAcademy</h1>
        </div>
        <nav class="navPrincipal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoria</a></li>
                <li><a href="inscripcion.html" id="btn_destacado">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <!--CONTENIDO PRINCIPAL-->
    <main class="contenedor_principal">
        <section class="pagina">
            <h2>Inscríbete a un curso</h2>
            <p class="intro">Llena el formulario. Todos los campos son obligatorios.</p>

            <form class="formulario" action="inscripcion.html" method="get">

                <fieldset>
                    <legend>Datos del estudiante</legend>

                    <label for="nombre">Nombre(s)</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required>

                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" required>

                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" placeholder="10 dígitos" required>

                    <label for="nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="nacimiento" name="nacimiento" required>
                </fieldset>

                <fieldset>
                    <legend>Datos del curso</legend>

                    <label for="curso">Curso</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecciona un curso</option>
                        <option value="frontend">Desarrollo Web Frontend</option>
                        <option value="python">Python para Ciencia de Datos</option>
                        <option value="bd">Bases de Datos Robustas</option>
                        <option value="backend">Programación Backend con APIs</option>
                        <option value="ciberseguridad">Fundamentos de Ciberseguridad</option>
                        <option value="ia">Introducción a la IA Generativa</option>
                    </select>

                    <p class="etiqueta">Modalidad</p>
                    <div class="opciones">
                        <label><input type="radio" name="modalidad" value="en_linea" required> En línea</label>
                        <label><input type="radio" name="modalidad" value="presencial" required> Presencial</label>
                    </div>

                    <label for="motivo">¿Por qué quieres tomar este curso?</label>
                    <textarea id="motivo" name="motivo" rows="4" required></textarea>
                </fieldset>

                <label class="acepto">
                    <input type="checkbox" name="acepto" value="si" required>
                    Acepto las reglas del programa de mentoría
                </label>

                <button type="submit" id="btn_accion">Inscribirme</button>
            </form>
        </section>
    </main>

    <!--Pie de página-->
    <footer>
        <p>&copy; 2026 TechAcademy</p>
    </footer>
</body>
</html>
